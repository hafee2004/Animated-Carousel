<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Carousel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h2 style="text-align:center;color:white;">Animated Carousel</h92>

  <div class="carousel">
    <div class="carousel-track">
      <div class="slide"><img src="https://picsum.photos/id/1015/800/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1016/800/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1018/800/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1020/800/400" /></div>
    </div>

    <button class="nav prev">❮</button>
    <button class="nav next">❯</button>

    <div class="dots"></div>
  </div>

  <!-- JavaScript MUST be here -->
  <script src="./script.js"></script>
</body>
</html>
